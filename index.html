<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة خاصة لملاك 🎁</title>
    <style>
        :root {
            --primary: #ff1b6b;
            --secondary: #ff8e91;
            --bg: #fff5f6;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 27, 107, 0.2);
            width: 90%;
            max-width: 500px;
            z-index: 10;
        }

        h1 { color: var(--primary); margin-bottom: 20px; }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
            font-weight: bold;
        }

        .btn-yes { background: var(--primary); color: white; }
        .btn-yes:hover { transform: scale(1.1); background: #e0155a; }

        .btn-no { background: #eee; color: #777; }

        /* اللعبة */
        #game-zone {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .balloon {
            width: 60px;
            height: 80px;
            background: var(--primary);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-20vh) rotate(20deg); }
        }

        /* رسالة النهاية */
        #final-msg {
            display: none;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .heart-rose { font-size: 2.5em; margin: 10px; }
    </style>
</head>
<body>

<div class="container" id="start-screen">
    <h1>مرحباً ملاك 🌹</h1>
    <p style="font-size: 1.2em;">هل أنتِ مستعدة لخوض هذه التجربة؟</p>
    <div style="margin-top: 20px;">
        <button class="btn btn-yes" onclick="startGame()">نعم، مستعدة</button>
        <button class="btn btn-no" onclick="sayNo()">لا</button>
    </div>
</div>

<div id="game-zone">
    <div style="position: absolute; top: 20px; font-size: 1.2em; color: var(--primary); font-weight: bold;">
        فرقعي 16 بالونة لتصلي للمفاجأة! <br>
        البالونات المتبقية: <span id="counter">16</span>
    </div>
</div>

<div class="container" id="final-msg">
    <div class="heart-rose">❤️🌹🎂🌹❤️</div>
    <h1>كل عام وأنتِ بخير يا ملاك!</h1>
    <p style="font-size: 1.3em; line-height: 1.6;">
        بمناسبة عيد ميلادك الـ <span style="color: var(--primary); font-weight: bold;">16</span>.. <br>
        أردت أن أهنئكِ بطريقتي الخاصة. <br>
        أنتِ لستِ مجرد شخص عادي، أنتِ مميزة جداً.
    </p>
    <div class="heart-rose">💖🌸🌷🌸💖</div>
</div>

<script>
    let balloonsPopped = 0;
    const totalBalloons = 16;
    const colors = ['#ff1b6b', '#ff8e91', '#ff4d4d', '#ffb6c1'];

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-zone').style.display = 'flex';
        spawnBalloons();
    }

    function sayNo() {
        document.getElementById('start-screen').innerHTML = "<h1>شكراً على اهتمامك.</h1>";
    }

    function spawnBalloons() {
        if (balloonsPopped < totalBalloons) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 80 + 10 + '%';
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.innerText = balloonsPopped + 1;
            
            balloon.onclick = function() {
                this.remove();
                balloonsPopped++;
                document.getElementById('counter').innerText = totalBalloons - balloonsPopped;
                if (balloonsPopped === totalBalloons) {
                    showFinalMessage();
                } else {
                    spawnBalloons();
                }
            };
            document.getElementById('game-zone').appendChild(balloon);
        }
    }

    function showFinalMessage() {
        document.getElementById('game-zone').style.display = 'none';
        document.getElementById('final-msg').style.display = 'block';
        // إضافة بعض الورود والقلوب تتساقط في الخلفية
        setInterval(createFloatingEmoji, 300);
    }

    function createFloatingEmoji() {
        const emojis = ['❤️', '💖', '🌹', '🌸'];
        const div = document.createElement('div');
        div.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        div.style.position = 'fixed';
        div.style.left = Math.random() * 100 + 'vw';
        div.style.top = '-50px';
        div.style.fontSize = '24px';
        div.style.transition = '4s linear';
        document.body.appendChild(div);
        
        setTimeout(() => {
            div.style.top = '110vh';
            div.style.transform = `rotate(${Math.random() * 360}deg)`;
        }, 100);
        
        setTimeout(() => div.remove(), 4000);
    }
</script>

</body>
</html>
